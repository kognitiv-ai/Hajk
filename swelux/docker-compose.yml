# Hajk with the Swelux plugin, behind a gateway that requires a swelux.ai login.
#
#   GATEWAY_PORT              host port the tunnel / reverse proxy points at
#   SWELUX_PLATFORM_UPSTREAM  base URL of the swelux-platform API, as seen from the gateway
#   SWELUX_NETWORK            docker network where the platform container is reachable
#   HAJK_NAME                 container and image name, so a second install (e.g. a beta) can run beside the first

services:
  hajk:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${HAJK_NAME:-swelux-hajk}:latest
    container_name: ${HAJK_NAME:-swelux-hajk}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      EXPOSE_CLIENT: "true"
      LOG_DEBUG_TO: console
      LOG_ACCESS_LOG_TO: console
    volumes:
      - ./hajk/App_Data/map_1.json:/usr/app/App_Data/map_1.json:ro
      - ./hajk/App_Data/layers.json:/usr/app/App_Data/layers.json:ro
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    container_name: ${HAJK_NAME:-swelux-hajk}-gateway
    restart: unless-stopped
    depends_on:
      - hajk
    environment:
      HAJK_UPSTREAM: http://hajk:3002
      SWELUX_PLATFORM_UPSTREAM: ${SWELUX_PLATFORM_UPSTREAM:-http://swelux-platform:8080}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8092}:80"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/login:/usr/share/nginx/login:ro
    networks:
      - internal
      - swelux

networks:
  internal: {}
  swelux:
    external: true
    name: ${SWELUX_NETWORK:-lightwise-studio_lightwise-network}
