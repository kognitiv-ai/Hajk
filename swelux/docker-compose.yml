# Hajk with the Swelux plugin, behind a gateway that requires a swelux.ai login.
#
#   SWELUX_TENANT     tenant slug whose members may open the map (e.g. goteborg)
#   SWELUX_DATA_DIR   host directory with the municipality's GeoJSON (kept out of git)
#   GATEWAY_PORT      host port the tunnel / reverse proxy points at
#   SWELUX_NETWORK    docker network where the swelux API container is reachable

services:
  hajk:
    build:
      context: ..
      dockerfile: Dockerfile
    image: swelux-hajk:latest
    container_name: swelux-hajk
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      EXPOSE_CLIENT: "true"
      LOG_DEBUG_TO: console
      LOG_ACCESS_LOG_TO: console
    volumes:
      - ./hajk/App_Data/map_1.json:/usr/app/App_Data/map_1.json:ro
      - ./hajk/App_Data/layers.json:/usr/app/App_Data/layers.json:ro
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    container_name: swelux-hajk-gateway
    restart: unless-stopped
    depends_on:
      - hajk
    environment:
      SWELUX_TENANT: ${SWELUX_TENANT:?set SWELUX_TENANT}
      HAJK_UPSTREAM: http://swelux-hajk:3002
      SWELUX_API_UPSTREAM: ${SWELUX_API_UPSTREAM:-http://lightwise-calc-engine:5183}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8092}:80"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway/login:/usr/share/nginx/login:ro
      - ${SWELUX_DATA_DIR:?set SWELUX_DATA_DIR}:/srv/swelux-data:ro
    networks:
      - internal
      - swelux

networks:
  internal: {}
  swelux:
    external: true
    name: ${SWELUX_NETWORK:-lightwise-studio_lightwise-network}
