<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Logga in · Belysningskarta</title>
<style>
  :root {
    --navy: #10162A;
    --amber: #F2B544;
    --cream: #F6F4EE;
    --ink: #1F2933;
    --muted: #5F6B76;
    --line: #DCD8CC;
    --fail: #B4441F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--cream);
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  header { background: var(--navy); color: var(--cream); padding: 22px 28px; display: flex; align-items: center; gap: 12px; }
  header img { width: 28px; height: 28px; }
  header strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
  header span { display: block; font-size: 13px; color: #AEB8D0; }
  form { padding: 24px 28px 28px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
  input {
    height: 42px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px;
    font: inherit; color: var(--ink); background: #FCFBF8;
  }
  input:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: transparent; }
  button {
    height: 44px; border: 0; border-radius: 6px; background: var(--navy); color: var(--cream);
    font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  .error { color: var(--fail); font-size: 14px; min-height: 1.5em; margin: 0; }
  .fine { font-size: 13px; color: var(--muted); margin: 0; }
  .fine a { color: inherit; }
  #pick { padding: 22px 28px 26px; display: grid; gap: 12px; }
  #pick h2 { margin: 0; font-size: 16px; }
  #list { display: grid; gap: 8px; }
  #list button {
    margin: 0; height: auto; min-height: 52px; padding: 10px 14px; text-align: left;
    background: #FCFBF8; color: var(--ink); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600;
  }
  #list button:hover, #list button:focus-visible { border-color: var(--amber); outline: none; background: #fff; }
  #list small { font-weight: 400; color: var(--muted); white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/login/logo.svg" alt="">
    <div>
      <strong>Belysningskarta</strong>
      <span>Hajk med beräkningar från swelux.ai</span>
    </div>
  </header>
  <form id="f" novalidate>
    <label>E-post
      <input name="email" type="email" autocomplete="username" required autofocus>
    </label>
    <label>Lösenord
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="err" role="alert"></p>
    <button type="submit" id="go">Logga in</button>
    <p class="fine">Samma konto som på <a href="https://swelux.ai">swelux.ai</a>. Saknar du konto? Kontakta din kontaktperson på swelux.</p>
  </form>
  <section id="pick" hidden>
    <h2>Välj organisation</h2>
    <div id="list"></div>
    <p class="error" id="pickErr" role="alert"></p>
    <p class="fine"><a href="/logout">Logga in med ett annat konto</a></p>
  </section>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var WANTED = (params.get("tenant") || "").toLowerCase();
  var form = document.getElementById("f");
  var err = document.getElementById("err");
  var go = document.getElementById("go");
  var pick = document.getElementById("pick");
  var list = document.getElementById("list");
  var pickErr = document.getElementById("pickErr");
  var nf = new Intl.NumberFormat("sv-SE");

  function nextUrl() {
    var n = params.get("next") || "/";
    // Only same-site paths: no scheme, no protocol-relative URLs, no login loop.
    return /^\/(?!\/)/.test(n) && n.indexOf("/login") !== 0 ? n : "/";
  }

  function hasToken() {
    return document.cookie.split(";").some(function (c) { return c.trim().indexOf("swelux_token=") === 0; });
  }

  function setCookie(name, value, maxAge) {
    document.cookie = name + "=" + encodeURIComponent(value) + "; Path=/; Max-Age=" + maxAge + "; Secure; SameSite=Strict";
  }

  function choose(slug) {
    setCookie("swelux_tenant", slug, 60 * 60 * 24 * 30);
    location.replace(nextUrl());
  }

  // Tenants this login may open (all of them for platform admins). One, or the
  // one asked for in ?tenant=, opens straight away; several show a picker.
  function loadTenants() {
    return fetch("/swelux-api/hajk/tenants", { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) return null;
      if (!res.ok) throw new Error("Kartan går inte att öppna just nu. Försök igen om en stund.");
      return res.json();
    });
  }

  function showTenants(tenants) {
    if (tenants.length === 0) {
      form.hidden = true;
      pick.hidden = false;
      list.innerHTML = "";
      pickErr.textContent = "Ditt konto har inte åtkomst till någon belysningskarta ännu.";
      return;
    }
    var wanted = tenants.filter(function (t) { return t.slug === WANTED; })[0];
    if (wanted) return choose(wanted.slug);
    if (tenants.length === 1 && !params.has("switch")) return choose(tenants[0].slug);
    form.hidden = true;
    pick.hidden = false;
    list.innerHTML = "";
    tenants.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      var name = document.createElement("span");
      name.textContent = t.name;
      var count = document.createElement("small");
      count.textContent = t.lightingPointCount ? nf.format(t.lightingPointCount) + " ljuspunkter" : "ingen kartdata";
      b.appendChild(name);
      b.appendChild(count);
      b.addEventListener("click", function () { choose(t.slug); });
      list.appendChild(b);
    });
    list.querySelector("button").focus();
  }

  if (hasToken()) {
    loadTenants().then(function (tenants) {
      if (tenants) showTenants(tenants);
    }).catch(function () { /* fall back to the login form */ });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    var email = form.email.value.trim();
    var password = form.password.value;
    if (!email || !password) { err.textContent = "Fyll i e-post och lösenord."; return; }
    go.disabled = true;
    fetch("/swelux-api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      if (res.status === 401 || res.status === 400) throw new Error("Fel e-post eller lösenord.");
      if (!res.ok) throw new Error("Inloggningen fungerar inte just nu. Försök igen om en stund.");
      return res.json();
    }).then(function (auth) {
      var maxAge = Math.max(60, Math.floor((new Date(auth.expiration) - new Date()) / 1000));
      setCookie("swelux_token", auth.token, maxAge);
      return loadTenants();
    }).then(function (tenants) {
      if (!tenants) throw new Error("Inloggningen fungerar inte just nu. Försök igen om en stund.");
      showTenants(tenants);
      go.disabled = false;
    }).catch(function (e2) {
      err.textContent = e2.message;
      go.disabled = false;
    });
  });
})();
</script>
</body>
</html>
